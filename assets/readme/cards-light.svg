<rect x="52" y="44" width="48" height="48" rx="14" fill="#EEE9FF"/>
<text x="76" y="76" font-size="20" font-weight="700" text-anchor="middle" fill="#7A5AF0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans', sans-serif">44</text>
<text x="120" y="78" font-size="27" font-weight="700" fill="#1D1B26">Count at a glance</text>
<text x="52" y="138" font-size="20" fill="#6B6780">Uses, time left and pace.</text>
<rect x="416" y="16" width="368" height="158" rx="22" fill="#F7F6FB" stroke="#E4E1EE"/>
<rect x="444" y="44" width="48" height="48" rx="14" fill="#EEE9FF"/>
<rect x="452" y="58" width="22" height="8" rx="4" fill="#7A5AF0"/><rect x="462" y="70" width="22" height="8" rx="4" fill="none" stroke="#C93A40" stroke-width="2" stroke-dasharray="3 2"/>
<text x="512" y="78" font-size="27" font-weight="700" fill="#1D1B26">Never overlap</text>
<text x="444" y="138" font-size="20" fill="#6B6780">Warned before you cut one short.</text>
<rect x="808" y="16" width="368" height="158" rx="22" fill="#F7F6FB" stroke="#E4E1EE"/>
