<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-labelledby="t d">
<title id="t">Pass Countdown 能做什么</title>
<desc id="d">剩几次一眼看到：剩余次数、当前这张还剩多久、最晚什么时候开下一张。不会叠着用：新开的会压掉正在用的那张时，先提醒你。提醒带出 Obsidian：导出 .ics，每张到期前提醒。</desc>
