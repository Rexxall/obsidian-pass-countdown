<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-labelledby="t d">
<title id="t">What Pass Countdown does</title>
<desc id="d">Count at a glance: uses left, time left on the running pass and the latest start that still fits every pass. Never overlap: a warning before a new pass would cut the running one short. Reminders outside Obsidian: an .ics file with alerts before each pass ends.</desc>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans', sans-serif">
