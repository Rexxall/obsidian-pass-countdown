<path d="M851 75 V66 a9 9 0 0 1 18 0 V75 Z" fill="none" stroke="#7A5AF0" stroke-width="2.5" stroke-linejoin="round"/><path d="M848 75 H872" stroke="#7A5AF0" stroke-width="2.5" stroke-linecap="round"/><circle cx="860" cy="80" r="2.5" fill="#7A5AF0"/>
<text x="904" y="78" font-size="27" font-weight="700" fill="#1D1B26">Reminders outside</text>
